[package]
name = "docket"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "docket"
path = "src/bin/docket/main.rs"

[features]
# Stands in for caddy-tailscale so the app runs locally against fixtures:
# seeds an empty database and signs requests in as a user picked from the
# menu. Never enable it in a deployed build.
dev = []

[dependencies]
axum = "*"
camino = "*"
clap = { version = "*", features = ["derive", "env"] }
fs-err = "*"
html2text = "*"
jiff = { version = "*", features = ["serde"] }
kdl = "*"
maud = { version = "*", features = ["axum"] }
miette = { version = "*", features = ["fancy"] }
reqwest = { version = "*", features = ["json"] }
rusqlite = { version = "*", features = ["bundled", "jiff"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
thiserror = "*"
tokio = { version = "*", features = ["full"] }
tower = "*"
tower-http = { version = "*", features = ["compression-gzip", "trace"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }

[dev-dependencies]
hegeltest = "*"
reqwest = { version = "*", features = ["form"] }
tempfile = "*"

[lints.clippy]
self_named_module_files = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
