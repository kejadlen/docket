# The one Fly config, for the two demo apps: the app main deploys (the
# deploy job in .github/workflows/ci.yml) and the per-PR previews (the
# review-app action in .github/workflows/preview.yml, which overrides
# the app name with the PR's). Both run the binary with --dev, which is
# the whole of what makes them demos: fixture data instead of JMAP, and
# a stand-in identity in place of the Tailscale-User-Login header that
# tailscale serve supplies in front of the real deployment. No volume,
# so every deploy starts from the fixtures again.
#
# The app name is Fly's, not GitHub's, so it has to be unique across all
# of Fly and a taken one fails the deploy. ci.yml spells it twice more,
# as FLY_APP to create it on the first deploy and in the environment's
# URL, so a rename here is a rename in three places.
app = 'docket-demo'
primary_region = 'sjc'

[build]

[env]
# Fly's edge routes to the machine, not to localhost.
DOCKET_BIND = '0.0.0.0:3000'

[processes]
app = '--dev'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
